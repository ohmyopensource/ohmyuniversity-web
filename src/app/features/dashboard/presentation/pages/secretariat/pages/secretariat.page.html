<app-card-status
  statusVariant="warning"
  [icon]="lucideAlertTriangle"
  title="Pagina in sviluppo"
  description="Questa pagina è visibile a scopo dimostrativo ma non fa parte della release corrente dello sprint." />

<app-dashboard-container>
  <app-dashboard-header
    title="Segreteria"
    description="Borse di studio, modulistica, bandi, tirocini e situazione tasse in un unico posto." />

  <!-- Mobile Tabs -->
  <div class="sm:hidden pb-4">
    <app-custom-tabs
      [tabs]="tabs"
      [activeTab]="activeTab()"
      tabStyle="pill"
      size="sm"
      [vertical]="true"
      (tabChange)="onTabChange($event)" />
  </div>

  <!-- Desktop Tabs -->
  <div class="hidden sm:flex flex-1 py-4">
    <app-custom-tabs
      [tabs]="tabs"
      [activeTab]="activeTab()"
      tabStyle="pill"
      size="md"
      (tabChange)="onTabChange($event)" />
  </div>

  @if (activeTab() !== 'fees' && activeTab() !== 'internships') {
    <div class="pb-3">
      <app-custom-input
        [placeholder]="
          activeTab() === 'scholarships'
            ? 'Cerca borse di studio...'
            : activeTab() === 'forms'
              ? 'Cerca moduli per nome o categoria...'
              : 'Cerca bandi e concorsi...'
        "
        [iconLeft]="iconSearch"
        size="sm"
        [fullWidth]="true"
        [clearable]="true"
        (inputChange)="onSearchChange($event)" />
    </div>
  }

  @if (activeTab() === 'scholarships') {
    <app-scholarships-tab
      [scholarships]="filteredScholarships()"
      (apply)="onApplyScholarship($event)" />
  }

  @if (activeTab() === 'forms') {
    <app-forms-tab [forms]="filteredForms()" />
  }

  @if (activeTab() === 'bandi') {
    <app-bandi-tab [bandi]="filteredBandi()" />
  }

  @if (activeTab() === 'internships') {
    <app-internships-tab
      [applications]="internshipApplications()"
      [loading]="internshipsLoading()"
      [error]="internshipsError()"
      [hasCarriera]="hasCarriera" />
  }

  @if (activeTab() === 'fees') {
    <app-fees-tab
      [tasse]="tasse()"
      [loading]="tasseLoading()"
      [error]="tasseError()"
      [hasCarriera]="hasCarriera" />
  }
</app-dashboard-container>
