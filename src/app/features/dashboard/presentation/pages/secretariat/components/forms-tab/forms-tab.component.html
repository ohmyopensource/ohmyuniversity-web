<div class="flex flex-col gap-5">
  @for (category of categories(); track category) {
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-2">
        <span
          class="text-[0.68rem] font-bold uppercase tracking-widest px-2 py-0.5 rounded-md"
          style="background: var(--color-neutral-200); color: var(--color-neutral-500)">
          {{ category }}
        </span>
      </div>
      <div class="flex flex-col gap-2">
        @for (form of formsForCategory(category); track form.id) {
          <app-custom-card variant="default" padding="md" shadow="sm" [bordered]="true" radius="lg">
            <div class="flex flex-col gap-4">
              <div class="flex items-start justify-between gap-3 flex-wrap">
                <div class="flex-1 min-w-0">
                  <h3 appText variant="h6" class="m-0">{{ form.name }}</h3>
                  <p class="text-[0.75rem] m-0 mt-0.5" style="color: var(--color-neutral-400)">
                    {{ form.description }}
                  </p>
                </div>
              </div>

              <div
                class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-3"
                style="border-top: 1px solid var(--color-neutral-200)">
                <div class="flex items-center gap-1.5">
                  <svg
                    [lucideIcon]="iconCalendar"
                    [size]="13"
                    style="color: var(--color-neutral-400)"
                    aria-hidden="true"></svg>
                  <span class="text-[0.75rem]" style="color: var(--color-neutral-500)">
                    Aggiornato: {{ form.updatedAt }}
                  </span>
                </div>
                <app-custom-button
                  variant="primary"
                  size="sm"
                  label="Apri"
                  [icon]="iconExternalLink"
                  iconPosition="right"
                  mode="link-external"
                  [href]="form.url"
                  target="_blank" />
              </div>
            </div>
          </app-custom-card>
        }
      </div>
    </div>
  }

  @if (forms().length === 0) {
    <ng-content />
  }
</div>
