<app-dashboard-widget-card
  [size]="size"
  [sectionIcon]="lucideCalendar"
  sectionLabel="Agenda"
  [widgetLabel]="todayLabel"
  color="agenda">
  <div class="flex flex-col h-full overflow-y-auto gap-1.5">
    @if (todayEvents().length === 0) {
      <div class="flex items-center justify-center h-full">
        <p appText variant="caption" color="muted">Nessun evento oggi</p>
      </div>
    } @else {
      @for (event of todayEvents(); track event.id) {
        <app-agenda-event-card [event]="event" [compact]="true" />
      }
    }
  </div>

  <div footer class="px-3 pb-2">
    <app-custom-link
      href="/dashboard/agenda"
      [label]="'Vai all\'agenda del ' + todayLabel"
      mode="internal"
      size="sm" />
  </div>
</app-dashboard-widget-card>
