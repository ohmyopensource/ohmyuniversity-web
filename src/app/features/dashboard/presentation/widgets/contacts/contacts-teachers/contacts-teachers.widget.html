<app-dashboard-widget-card
  [size]="size"
  [sectionIcon]="lucideContact"
  sectionLabel="Contatti"
  widgetLabel="Docenti del tuo corso"
  color="contacts">
  <div class="flex flex-col h-full overflow-y-auto py-1 gap-1">
    @if (loading()) {
      <p appText variant="caption" color="muted">Caricamento...</p>
    } @else if (teachers().length === 0) {
      <p appText variant="caption" color="muted">Nessun docente trovato.</p>
    } @else {
      @for (teacher of teachers(); track teacher.id ?? teacher.name) {
        <div
          class="flex items-center gap-2 p-2 rounded-xl hover:bg-white/60 transition-all border-b border-gray-100 last:border-0">
          <p appText variant="caption" weight="semibold" [truncate]="true">{{ teacher.name }}</p>
        </div>
      }
    }
  </div>

  <div footer class="px-3 pb-2">
    <app-custom-link
      href="/dashboard/contatti-universitari"
      label="Vai ai contatti"
      mode="internal"
      size="sm" />
  </div>
</app-dashboard-widget-card>
