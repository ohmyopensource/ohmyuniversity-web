<app-dashboard-widget-card
  [size]="size"
  [sectionIcon]="lucideContact"
  sectionLabel="Contatti"
  widgetLabel="Numeri Utili"
  color="contacts">
  <div class="flex flex-col h-full overflow-y-auto py-1 gap-1">
    @if (contacts().length === 0) {
      <p appText variant="caption" color="muted">Nessun numero utile disponibile.</p>
    } @else {
      @for (contact of contacts(); track contact.id) {
        <div
          class="flex flex-col gap-0.5 p-2 rounded-xl hover:bg-white/60 transition-all border-b border-gray-100 last:border-0">
          <p appText variant="caption" weight="semibold" [truncate]="true">{{ contact.name }}</p>
          @if (contact.phone) {
            <a
              [href]="'tel:' + contact.phone"
              class="text-[10px] no-underline"
              style="color: var(--color-contacts-dark)">
              {{ contact.phone }}
            </a>
          }
          @if (contact.hours) {
            <p appText variant="caption" color="muted" class="text-[10px]">{{ contact.hours }}</p>
          }
        </div>
      }
    }
  </div>

  <div footer class="px-3 pb-2">
    <app-custom-link
      href="/dashboard/contatti-universitari"
      label="Vai ai contatti"
      mode="internal"
      size="sm" />
  </div>
</app-dashboard-widget-card>
