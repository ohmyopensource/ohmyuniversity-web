<app-dashboard-widget-card
  [size]="size"
  [sectionIcon]="lucideCalendarDays"
  sectionLabel="Appelli"
  widgetLabel="Appelli disponibili"
  color="exams">
  @if (availableExams(); as exams) {
    @if (exams.length > 0) {
      <div class="flex flex-col gap-1 h-full overflow-y-auto">
        @for (exam of exams; track exam.id) {
          <div class="flex items-center justify-between gap-1.5 py-1 px-1.5 rounded-lg bg-white/60">
            <div class="flex flex-col gap-0.5 min-w-0 flex-1">
              <p appText variant="caption" weight="bold" [truncate]="true">{{ exam.courseName }}</p>
              <p appText variant="caption" color="muted" class="text-[10px]">
                Scade il {{ exam.enrollDeadline }}
              </p>
            </div>
            <app-custom-badge
              [label]="statusLabel[exam.status]"
              [variant]="statusVariant[exam.status]"
              size="xs"
              shape="rounded" />
          </div>
        }
      </div>
    } @else {
      <div class="flex items-center justify-center h-full">
        <p appText variant="caption" color="muted">Nessun appello disponibile</p>
      </div>
    }
  } @else {
    <div class="flex items-center justify-center h-full">
      <p appText variant="caption" color="muted">Caricamento...</p>
    </div>
  }

  <div footer class="px-3 pb-2">
    <app-custom-link
      href="/dashboard/appelli?tab=exams"
      label="Vai agli appelli"
      mode="internal"
      size="sm" />
  </div>
</app-dashboard-widget-card>
